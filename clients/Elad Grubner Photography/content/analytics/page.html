          '</tr></thead><tbody>';
        FP.posts.forEach(function (p) {
          var title = p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a>' : esc(p.title);
          var dc = p.designersCommented === true ? 'כן' : p.designersCommented === false ? 'לא' : '-';
          html += '<tr><td><div class="post-title">' + title + '</div>' +
            '<div class="post-meta"><span>' + esc(d(p.date)) + (p.type ? ' · ' + esc(p.type) : '') + '</span></div>' +
            (p.note ? '<div class="post-note">' + esc(p.note) + '</div>' : '') + '</td>' +
            '<td class="n" data-label="ריאקשנים">' + n(p.reactions) + '</td><td class="n" data-label="תגובות">' + n(p.comments) + '</td><td class="n" data-label="שיתופים">' + n(p.shares) + '</td><td class="n" data-label="מעצבות הגיבו">' + dc + '</td></tr>';
        });
        html += '</tbody></table></div>';
      }
      html += '</section>';
    }

    var R = D.references || [];
    html += '<section class="section"><div class="section-head"><h2>מה קורה אצל צלמי הרפרנס</h2>' + (D.referencesSummary ? '<p class="sub">' + esc(D.referencesSummary) + '</p>' : '') + '</div>';
    if (R.length) {
      html += '<div class="refs">';
      R.forEach(function (r) {
        var stats = '';
        if (r.followers != null) stats += '<span class="stat">' + n(r.followers) + ' עוקבים</span>';
        if (r.postsThisWeek != null) stats += '<span class="stat">' + r.postsThisWeek + ' פוסטים השבוע</span>';
        stats += '<span class="stat src">' + (r.source === 'metricool' ? 'מטריקול' : 'נבדק בעמוד') + '</span>';
        html += '<div class="card ref"><div class="ref-head"><span class="avatar">' + esc((r.name || r.handle || '?').trim().charAt(0)) + '</span>' +
          '<span class="who">' + esc(r.name) + '</span>' +
          '<a class="handle" href="https://www.instagram.com/' + esc(r.handle) + '/" target="_blank" rel="noopener">@' + esc(r.handle) + '</a></div>' +
          '<div class="stats">' + stats + '</div>' +
          '<p>' + esc(r.highlight || 'לא נבדק השבוע.') + (r.bestUrl ? ' <a href="' + esc(r.bestUrl) + '" target="_blank" rel="noopener">לפוסט</a>' : '') + '</p></div>';
      });
      html += '</div>';
    }
    html += '</section>';

    if (D.extra && D.extra.title) {
      html += '<section class="section"><div class="section-head"><h2>' + esc(D.extra.title) + '</h2></div><div class="callout"><p>' + esc(D.extra.text) + '</p></div></section>';
    }

    var S = D.suggestions || [];
    html += '<section class="section"><div class="section-head"><h2>מה כדאי לנסות</h2><p class="sub">הצעות בלבד - נכנסות לעבודה רק אחרי אישור</p></div>';
    if (S.length) {
      html += '<ol class="sugg">';
      S.forEach(function (s, i) { html += '<li class="card"><span class="no">' + (i + 1) + '</span><span class="text">' + esc(s.text) + '</span><span class="owner">' + (s.owner ? 'מי מיישמת: <b>' + esc(s.owner) + '</b>' : '') + '</span></li>'; });
      html += '</ol>';
    } else {
      html += '<p class="empty">אין שינוי מומלץ השבוע - ממשיכים כמו שזה.</p>';
    }
    html += '</section>';

    // promotion candidates: flagged by the analyst, decided by the ads strategist, approved by Adi
    var PR = D.promote || null;
    if (PR && ((PR.candidates || []).length || PR.summary)) {
      html += '<section class="section"><div class="section-head"><h2>מועמדים לקידום ממומן</h2><p class="sub">' + (PR.summary ? esc(PR.summary) : 'פוסטים שבלטו באורגני - האסטרטג של הממומן מחליט, ועדי מאשרת') + '</p></div>';
      if ((PR.candidates || []).length) {
        html += '<div class="refs">';
        PR.candidates.forEach(function (c) {
          html += '<div class="card ref"><div class="who">' + (c.url ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.title) + '</a>' : esc(c.title)) + (c.date ? ' <small>· ' + esc(d(c.date)) + '</small>' : '') + '</div>' +
            (c.why ? '<p>' + esc(c.why) + '</p>' : '') +
            (c.decision ? '<div class="stats"><span class="stat src">החלטה: ' + esc(c.decision) + '</span></div>' : '') + '</div>';
        });
        html += '</div>';
      }
      html += '</section>';
    }

    html += '<footer>' + rule + '<span>הנתונים ממטריקול · אינסטגרם ופייסבוק, אורגני בלבד · עודכן ' + esc(D.generatedAt || '') + '</span></footer>';
    app.innerHTML = html;

    app.querySelectorAll('button[data-i]').forEach(function (bt) {
      bt.addEventListener('click', function () {
        var i = +bt.dataset.i;
        try { history.replaceState(null, '', i === 0 ? location.pathname + location.search : '#w' + WEEKS[i].reportDate); } catch (e) {}
        render(i);
        window.scrollTo({ top: 0 });
      });
    });
    METRICS.forEach(function (m, mi) { drawTrend(document.getElementById('tr-' + mi), m); });
  }

  function drawTrend(box, m) {
    if (!box) return;
    var pts = m._pts, N = m._n, W = 360, Ht = 110, padT = 14, padB = 22, padX = 10;
    var startV = START ? START[m.key] : null;
    var vals = pts.map(function (p) { return p.v; });
    if (startV != null) vals.push(startV);
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (m.key !== 'followers') lo = 0;
    if (hi === lo) hi = lo + (hi || 1);
    var pad = (hi - lo) * 0.12; hi += pad; if (m.key === 'followers') lo -= pad;
    var ih = Ht - padT - padB, iw = W - padX * 2;
    // oldest week on the right, newest on the left - Hebrew reading direction
    var x = function (i) { return N <= 1 ? W / 2 : W - padX - (i / (N - 1)) * iw; };
    var y = function (v) { return padT + ih - (v - lo) / (hi - lo) * ih; };
    var line = pts.map(function (p, k) { return (k ? 'L' : 'M') + x(p.i).toFixed(1) + ',' + y(p.v).toFixed(1); }).join(' ');
    var area = line + ' L' + x(pts[pts.length - 1].i).toFixed(1) + ',' + (padT + ih) + ' L' + x(pts[0].i).toFixed(1) + ',' + (padT + ih) + ' Z';
    var svg = '<svg viewBox="0 0 ' + W + ' ' + Ht + '" role="img" aria-label="' + esc(m.label) + ' לפי שבוע">' +
      '<line x1="' + padX + '" x2="' + (W - padX) + '" y1="' + (padT + ih) + '" y2="' + (padT + ih) + '" stroke="var(--line)" stroke-width="1"/>';
    if (startV != null) svg += '<line x1="' + padX + '" x2="' + (W - padX) + '" y1="' + y(startV).toFixed(1) + '" y2="' + y(startV).toFixed(1) + '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>';
    svg += '<path d="' + area + '" fill="var(--bronze)" fill-opacity="0.12"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--bronze)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    var first = pts[0], lastP = pts[pts.length - 1];
    svg += '<text x="' + x(first.i) + '" y="' + (Ht - 4) + '" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Assistant, sans-serif">' + d(first.h.weekStart) + '</text>' +
      '<text x="' + x(lastP.i) + '" y="' + (Ht - 4) + '" text-anchor="start" font-size="11" font-weight="700" fill="var(--ink-2)" font-family="Assistant, sans-serif">' + d(lastP.h.weekStart) + '</text>';
    pts.forEach(function (p, k) {
      var isLast = k === pts.length - 1;
      svg += '<circle cx="' + x(p.i) + '" cy="' + y(p.v) + '" r="' + (isLast ? 5 : 3) + '" fill="' + (isLast ? 'var(--bronze)' : 'var(--surface)') + '" stroke="' + (isLast ? 'var(--surface)' : 'var(--bronze)') + '" stroke-width="2"/>';
    });
    var slot = N > 1 ? iw / (N - 1) : iw;
    pts.forEach(function (p, k) {
      svg += '<rect x="' + (x(p.i) - slot / 2) + '" y="0" width="' + slot + '" height="' + Ht + '" fill="transparent" data-k="' + k + '"/>';
    });
    svg += '</svg><div class="tip" hidden></div>';
    box.innerHTML = svg;
    var tip = box.querySelector('.tip'), svgEl = box.querySelector('svg');
    box.querySelectorAll('rect[data-k]').forEach(function (rc) {
      rc.addEventListener('mouseenter', function () {
        var p = pts[+rc.dataset.k], sc = svgEl.getBoundingClientRect().width / W;
        tip.textContent = 'שבוע ' + d(p.h.weekStart) + ': ' + n(p.v, m.dec) + (p.h.posts != null ? ' · ' + p.h.posts + ' פוסטים' : '');
        tip.style.left = (x(p.i) * sc) + 'px';
        tip.style.top = (y(p.v) * sc - 8) + 'px';
        tip.hidden = false;
      });
      rc.addEventListener('mouseleave', function () { tip.hidden = true; });
    });
  }

  render(pick());
})();
</script>
