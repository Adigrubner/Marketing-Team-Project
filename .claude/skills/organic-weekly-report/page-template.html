<title>הדוח השבועי של אלעד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;600;700;800&display=swap">
<style>
/* Layout: RTL reading column. A warm header band carries the week's verdict; below it the four numbers, the trend, the posts (with inline reach bars against Elad's average), the reference photographers, and the suggestions as cards. One typeface (Assistant) - hierarchy comes from weight: 200 for big figures and titles, 700-800 for labels. */
:root {
  --bg: #FBFAF8;
  --surface: #FFFFFF;
  --panel: #F2EEE8;
  --panel-2: #EAE3D8;
  --ink: #2A2A2A;
  --ink-2: #5E5850;
  --muted: #8C857B;
  --line: #E6E0D7;
  --bronze: #7B5A2E;
  --bronze-soft: #E9DFD0;
  --bar-track: #EFEAE2;
  --good: #3F6B4A;
  --good-bg: #E3EDE4;
  --bad: #9A4A2F;
  --bad-bg: #F3E2DA;
  --shadow: 0 1px 2px rgba(60, 45, 25, .05), 0 4px 16px rgba(60, 45, 25, .05);
  --font: "Assistant", "Segoe UI", "Arial", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191816; --surface: #22201D; --panel: #2A2723; --panel-2: #332F2A; --ink: #EEE9E1; --ink-2: #C9C1B5; --muted: #9A9286;
    --line: #36332D; --bronze: #C9A26C; --bronze-soft: #3A3126; --bar-track: #2F2C27;
    --good: #8CC39A; --good-bg: #22332A; --bad: #E39B7E; --bad-bg: #3A2620;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #191816; --surface: #22201D; --panel: #2A2723; --panel-2: #332F2A; --ink: #EEE9E1; --ink-2: #C9C1B5; --muted: #9A9286;
  --line: #36332D; --bronze: #C9A26C; --bronze-soft: #3A3126; --bar-track: #2F2C27;
  --good: #8CC39A; --good-bg: #22332A; --bad: #E39B7E; --bad-bg: #3A2620;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.6;
  direction: rtl; padding-inline: 16px; padding-block: 24px 64px;
}
.wrap { max-width: 880px; margin-inline: auto; display: grid; gap: 40px; }
a { color: var(--bronze); text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; border-radius: 2px; }
h1, h2 { margin: 0; text-wrap: balance; color: var(--ink); }
.num { font-variant-numeric: tabular-nums; }

/* header band */
.hero { background: var(--panel); border-radius: 18px; padding: 36px clamp(20px, 5vw, 44px) 32px; display: grid; gap: 14px; }
.hero-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 12px; font-weight: 700; letter-spacing: .22em; color: var(--bronze); direction: ltr; }
.dates { font-size: 14px; font-weight: 600; color: var(--ink-2); background: var(--surface); padding: 4px 14px; border-radius: 999px; font-variant-numeric: tabular-nums; }
h1 { font-size: clamp(38px, 7vw, 58px); font-weight: 200; line-height: 1.05; letter-spacing: -.01em; }
.rule { display: flex; gap: 6px; align-items: center; }
.rule span { height: 1px; width: 56px; background: var(--bronze); }
.rule i { width: 6px; height: 6px; background: var(--bronze); }
.headline { font-size: clamp(19px, 2.6vw, 23px); font-weight: 300; line-height: 1.55; margin: 0; max-width: 60ch; color: var(--ink); }

/* KPI cards */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 16px; display: grid; gap: 2px; align-content: start; box-shadow: var(--shadow); }
.kpi .label { font-size: 13px; font-weight: 700; color: var(--muted); }
.kpi .value { font-size: 42px; font-weight: 200; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi .delta { font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
@media (max-width: 700px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* section */
.section { display: grid; gap: 16px; min-width: 0; }
.section-head { display: grid; gap: 2px; }
h2 { font-size: 24px; font-weight: 300; line-height: 1.3; }
.section-head .sub { font-size: 14.5px; color: var(--muted); margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.up { color: var(--good); background: var(--good-bg); }
.chip.down { color: var(--bad); background: var(--bad-bg); }
.chip.flat, .chip.young { color: var(--ink-2); background: var(--panel); }

/* week selector */
.weeks { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.weeks button { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums; }
.weeks button:hover { border-color: var(--bronze); color: var(--ink); }
.weeks button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.weeks button:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
.weeks-label { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.archive-note { background: var(--bronze-soft); color: var(--ink); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.archive-note button { font: inherit; font-weight: 700; color: var(--bronze); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* since-start strip */
.since { background: var(--panel); border-radius: 14px; padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: baseline; }
.since .k { font-size: 12.5px; font-weight: 700; color: var(--bronze); flex-basis: 100%; }
.since .item { display: grid; gap: 0; }
.since .item span { font-size: 12.5px; color: var(--muted); }
.since .item b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.since .chip.flat { background: var(--surface); }
.since .item b small { font-size: 13px; font-weight: 400; color: var(--muted); }

/* trend small multiples */
.trends { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.trend { padding: 16px 18px 12px; display: grid; gap: 6px; }
.trend-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.trend-head .label { font-size: 13px; font-weight: 700; color: var(--muted); }
.trend-head .value { font-size: 30px; font-weight: 200; line-height: 1.1; font-variant-numeric: tabular-nums; }
.trend-head .cmp { font-size: 12px; color: var(--muted); text-align: left; display: grid; justify-items: end; gap: 2px; }
.trend .chart { position: relative; }
.trend svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12.5px; padding: 5px 9px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); z-index: 2; }
.trend-note { font-size: 13px; color: var(--muted); }
@media (max-width: 640px) { .trends { grid-template-columns: 1fr; } }

/* posts table */
.table-card { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 680px; font-size: 14.5px; }
th, td { padding: 14px 14px; text-align: right; vertical-align: top; }
thead th { font-weight: 700; color: var(--muted); font-size: 12.5px; border-bottom: 1px solid var(--line); background: var(--panel); }
thead th:first-child { border-start-start-radius: 14px; }
thead th:last-child { border-start-end-radius: 14px; }
tbody tr + tr td { border-top: 1px solid var(--line); }
td.n, th.n { text-align: center; font-variant-numeric: tabular-nums; }
.post-title { font-weight: 700; font-size: 15.5px; }
.post-title a { color: var(--ink); text-decoration-color: var(--line); }
.post-title a:hover { color: var(--bronze); }
.post-meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 2px; }
.post-note { color: var(--ink-2); font-size: 13.5px; margin-top: 6px; max-width: 44ch; }
.reach { display: grid; gap: 6px; min-width: 150px; }
.reach-top { display: flex; align-items: baseline; gap: 8px; }
.reach-top b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 6px; background: var(--bar-track); border-radius: 3px; }
.track .fill { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--bronze); border-radius: 3px; }
.track .avg { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink-2); border-radius: 1px; }
/* phone: each post becomes a card - title, reach bar, then the five numbers in a row */
@media (max-width: 640px) {
  .table-card { overflow: visible; }
  table, tbody, tr, td { display: block; }
  table { min-width: 0; }
  thead { display: none; }
  tbody tr { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px 6px; padding: 16px; }
  tbody tr + tr { border-top: 1px solid var(--line); }
  tbody tr + tr td { border-top: 0; }
  td { padding: 0; }
  td:first-child, td.reach-cell { grid-column: 1 / -1; }
  td.n { font-size: 16px; font-weight: 600; }
  td.n::before { content: attr(data-label); display: block; font-size: 11px; font-weight: 600; color: var(--muted); line-height: 1.3; min-height: 2.6em; }
  .reach { min-width: 0; }
}

/* star / weak */
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pick { padding: 20px 22px; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 14px; align-content: start; }
.pick .icon { grid-row: span 3; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; font-weight: 700; }
.pick.star .icon { background: var(--good-bg); color: var(--good); }
.pick.weak .icon { background: var(--panel); color: var(--ink-2); }
.pick .k { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.pick .t { font-size: 19px; font-weight: 600; line-height: 1.35; }
.pick p { margin: 0; color: var(--ink-2); font-size: 15px; }
@media (max-width: 640px) { .pair { grid-template-columns: 1fr; } }

/* references */
.refs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ref { padding: 18px 20px; display: grid; gap: 10px; align-content: start; }
.ref-head { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 12px; align-items: center; }
.avatar { grid-row: span 2; width: 44px; height: 44px; border-radius: 50%; background: var(--bronze-soft); color: var(--bronze); display: grid; place-items: center; font-size: 18px; font-weight: 700; }
.ref .who { font-weight: 700; font-size: 15.5px; line-height: 1.3; }
.ref .handle { direction: ltr; text-align: right; font-size: 13px; color: var(--muted); text-decoration: none; overflow-wrap: anywhere; }
.ref .handle:hover { color: var(--bronze); }
.ref .stats { display: flex; flex-wrap: wrap; gap: 6px; }
.stat { font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--panel); padding: 2px 9px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.stat.src { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.ref p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
@media (max-width: 640px) { .refs { grid-template-columns: 1fr; } }

/* extra + suggestions */
.callout { background: var(--panel); border-radius: 14px; padding: 20px 22px; }
.callout p { margin: 0; color: var(--ink); font-size: 15.5px; }
.sugg { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.sugg li { padding: 18px 20px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 14px; align-items: start; }
.sugg .no { grid-row: span 2; width: 44px; height: 44px; border-radius: 12px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 20px; font-weight: 300; }
.sugg .text { font-size: 16px; font-weight: 400; color: var(--ink); }
.sugg .owner { font-size: 13px; color: var(--muted); }
.sugg .owner b { font-weight: 600; color: var(--bronze); }
.empty { color: var(--muted); }
footer { color: var(--muted); font-size: 13px; text-align: center; display: grid; gap: 6px; justify-items: center; padding-top: 8px; }
footer .rule span { width: 32px; }
</style>

<div class="wrap" id="app"></div>

<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
(function () {
  var ALL = JSON.parse(document.getElementById('report-data').textContent);
  var WEEKS = ALL.weeks || [], START = ALL.start || null;
  var app = document.getElementById('app');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function n(v, dec) { if (v == null || v === '' || isNaN(v)) return '–'; return Number(v).toLocaleString('he-IL', { maximumFractionDigits: dec || 0, minimumFractionDigits: 0 }); }
  function d(iso) { if (!iso) return ''; var p = iso.split('-'); return Number(p[2]) + '.' + Number(p[1]); }
  function chipPct(v) {
    if (v == null || isNaN(v)) return '';
    var cls = v >= 10 ? 'up' : v <= -10 ? 'down' : 'flat';
    var arrow = v >= 10 ? '↑' : v <= -10 ? '↓' : '';
    return '<span class="chip ' + cls + '"><span dir="ltr">' + (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(Math.round(v)) + '%</span>' + arrow + '</span>';
  }
  function chipChange(from, to) {
    if (from == null || to == null) return '';
    if (from === 0) return to > 0 ? '<span class="chip up">↑ מ-0</span>' : '<span class="chip flat">ללא שינוי</span>';
    if (from > 0 && to / from >= 2) return '<span class="chip up">↑ פי ' + n(to / from, to / from < 10 ? 1 : 0) + '</span>';
    return chipPct((to - from) / Math.abs(from) * 100);
  }
  var METRICS = [
    { key: 'avgReach', label: 'חשיפה ממוצעת לפוסט', dec: 0 },
    { key: 'avgSavesShares', label: 'שמירות ושיתופים לפוסט', dec: 2 },
    { key: 'avgComments', label: 'תגובות לפוסט', dec: 1 },
    { key: 'followers', label: 'עוקבים', dec: 0 }
  ];

  function pick() {
    var h = (location.hash || '').replace('#w', '');
    for (var i = 0; i < WEEKS.length; i++) if (WEEKS[i].reportDate === h) return i;
    return 0;
  }

  function render(idx) {
    var D = WEEKS[idx] || {};
    var a = D.account || {}, b = D.baseline || {}, w = D.week || {};
    var rule = '<div class="rule"><span></span><i></i></div>';
    var html = '';

    if (WEEKS.length > 1) {
      html += '<nav class="section" aria-label="בחירת שבוע" style="gap:8px"><span class="weeks-label">דוחות לפי שבוע</span><div class="weeks">';
      WEEKS.forEach(function (x, i) {
        html += '<button type="button" id="wk-' + esc(x.reportDate) + '" data-i="' + i + '" aria-pressed="' + (i === idx) + '">' + (i === 0 ? 'השבוע · ' : '') + d(x.weekStart) + '–' + d(x.weekEnd) + '</button>';
      });
      html += '</div></nav>';
      if (idx !== 0) html += '<div class="archive-note">זה הדוח של השבוע ' + d(D.weekStart) + '–' + d(D.weekEnd) + '. <button type="button" data-i="0">חזרה לשבוע האחרון</button></div>';
    }

    html += '<header class="hero">' +
      '<div class="hero-top"><span class="brand">ELAD GRUBNER · INSTAGRAM</span>' +
      '<span class="dates">' + esc(d(D.weekStart)) + ' – ' + esc(d(D.weekEnd)) + '.' + esc((D.weekEnd || '').slice(0, 4)) + '</span></div>' +
      '<h1>הדוח השבועי</h1>' + rule +
      '<p class="headline">' + esc(D.headline) + '</p>' +
    '</header>';

    var fc = a.followersChange;
    html += '<div class="kpis">' +
      '<div class="kpi"><span class="label">עוקבים</span><span class="value">' + n(a.followers) + '</span><span class="delta">' + (fc == null ? '' : '<b class="num">' + (fc > 0 ? '+' : '') + fc + '</b> השבוע') + '</span></div>' +
      '<div class="kpi"><span class="label">חשיפה ממוצעת לפוסט</span><span class="value">' + n(w.avgReach) + '</span><span class="delta">' + chipPct(w.avgReachVsBaseline) + ' מול הממוצע</span></div>' +
      '<div class="kpi"><span class="label">שמירות ושיתופים</span><span class="value">' + n(w.savesShares) + '</span><span class="delta">מעצבות ששמרו השראה</span></div>' +
      '<div class="kpi"><span class="label">פוסטים השבוע</span><span class="value">' + n(w.posts) + '</span><span class="delta">' + esc(w.postsNote || '') + '</span></div>' +
    '</div>';

    // since the machine started + trends
    var H = (D.history || []).slice(-12);
    var last = H[H.length - 1] || {};
    function nowOf(m) { return m.key === 'followers' ? (a.followers != null ? a.followers : last.followers) : last[m.key]; }
    if (START) {
      html += '<div class="since"><span class="k">מאז שהמכונה התחילה · מול ' + esc(START.label || '') + '</span>';
      METRICS.forEach(function (m) {
        var now = nowOf(m), was = START[m.key];
        if (was == null && now == null) return;
        html += '<div class="item"><span>' + m.label + '</span><b>' + n(was, m.dec) + ' <small>←</small> ' + n(now, m.dec) + ' ' + chipChange(was, now) + '</b></div>';
      });
      html += '</div>';
    }
    html += '<section class="section"><div class="section-head"><h2>המגמות</h2><p class="sub">שבוע אחרי שבוע, עד 12 שבועות אחורה. החץ משווה ל-4 שבועות לפני.' + (START ? ' הקו המקווקו הוא נקודת המוצא.' : '') + '</p></div><div class="trends">';
    METRICS.forEach(function (m, mi) {
      var pts = [];
      H.forEach(function (h, i) {
        var v = h[m.key];
        if (m.key === 'followers' && i === H.length - 1 && v == null) v = a.followers;
        if (v != null && !isNaN(v)) pts.push({ i: i, v: Number(v), h: h });
      });
      var cur = pts.length ? pts[pts.length - 1] : null, ref = null;
      if (cur) {
        for (var k = pts.length - 2; k >= 0; k--) { if (cur.i - pts[k].i >= 4) { ref = pts[k]; break; } }
        if (!ref && pts.length > 1) ref = pts[0];
      }
      html += '<div class="card trend"><div class="trend-head"><div><div class="label">' + m.label + '</div><div class="value">' + (cur ? n(cur.v, m.dec) : '–') + '</div></div>' +
        '<div class="cmp">' + (ref ? chipChange(ref.v, cur.v) + '<span>מול ' + d(ref.h.weekStart) + '</span>' : '') + '</div></div>';
      html += pts.length > 1 ? '<div class="chart" id="tr-' + mi + '"></div>' : '<div class="trend-note">המגמה תופיע אחרי עוד שבוע של נתונים.</div>';
      html += '</div>';
      m._pts = pts; m._n = H.length;
    });
    html += '</div></section>';

    var P = D.posts || [];
    var maxReach = Math.max.apply(null, P.map(function (p) { return p.reach || 0; }).concat([(b.avgReach || 0) * 1.25, 1]));
    html += '<section class="section"><div class="section-head"><h2>הפוסטים של השבוע</h2><p class="sub">הקו האנכי בכל פס הוא הממוצע של אלעד</p></div>';
    if (P.length) {
      html += '<div class="card table-card"><table><thead><tr>' +
        '<th>פוסט</th><th>חשיפה</th><th class="n">לייקים</th><th class="n">תגובות</th><th class="n">שמירות</th><th class="n">שיתופים</th><th class="n">עוקבים חדשים</th>' +
        '</tr></thead><tbody>';
      P.forEach(function (p) {
        var title = p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a>' : esc(p.title);
        var fillW = Math.min(100, (p.reach || 0) / maxReach * 100), avgX = Math.min(100, (b.avgReach || 0) / maxReach * 100);
        html += '<tr><td><div class="post-title">' + title + '</div>' +
          '<div class="post-meta"><span>' + esc(d(p.date)) + (p.time ? ' · ' + esc(p.time) : '') + ' · ' + esc(p.format) + '</span>' + (p.young ? '<span class="chip young">עוד צובר נתונים</span>' : '') + '</div>' +
          (p.note ? '<div class="post-note">' + esc(p.note) + '</div>' : '') + '</td>' +
          '<td class="reach-cell"><div class="reach"><div class="reach-top"><b>' + n(p.reach) + '</b>' + chipPct(p.vsAvg) + '</div>' +
          '<div class="track" aria-hidden="true"><div class="fill" style="width:' + fillW + '%"></div>' + (b.avgReach ? '<div class="avg" style="inset-inline-start:calc(' + avgX + '% - 1px)"></div>' : '') + '</div></div></td>' +
          '<td class="n" data-label="לייקים">' + n(p.likes) + '</td><td class="n" data-label="תגובות">' + n(p.comments) + '</td><td class="n" data-label="שמירות">' + n(p.saves) + '</td><td class="n" data-label="שיתופים">' + n(p.shares) + '</td><td class="n" data-label="עוקבים חדשים">' + n(p.follows) + '</td></tr>';
      });
      html += '</tbody></table></div>';
    } else {
      html += '<p class="empty">לא עלו פוסטים השבוע.</p>';
    }
    html += '</section>';

    if (D.star || D.weak) {
      html += '<div class="pair">';
      if (D.star) html += '<div class="card pick star"><span class="icon">↑</span><span class="k">מה עבד הכי טוב</span><span class="t">' + esc(D.star.title) + '</span><p>' + esc(D.star.why) + '</p></div>';
      if (D.weak) html += '<div class="card pick weak"><span class="icon">↓</span><span class="k">מה עבד פחות</span><span class="t">' + esc(D.weak.title) + '</span><p>' + esc(D.weak.why) + '</p></div>';
      html += '</div>';
    }

    var R = D.references || [];
    html += '<section class="section"><div class="section-head"><h2>מה קורה אצל צלמי הרפרנס</h2>' + (D.referencesSummary ? '<p class="sub">' + esc(D.referencesSummary) + '</p>' : '') + '</div>';
    if (R.length) {
      html += '<div class="refs">';
      R.forEach(function (r) {
        var stats = '';
        if (r.followers != null) stats += '<span class="stat">' + n(r.followers) + ' עוקבים</span>';
        if (r.postsThisWeek != null) stats += '<span class="stat">' + r.postsThisWeek + ' פוסטים השבוע</span>';
        stats += '<span class="stat src">' + (r.source === 'metricool' ? 'מטריקול' : 'נבדק בעמוד') + '</span>';
        html += '<div class="card ref"><div class="ref-head"><span class="avatar">' + esc((r.name || r.handle || '?').trim().charAt(0)) + '</span>' +
          '<span class="who">' + esc(r.name) + '</span>' +
          '<a class="handle" href="https://www.instagram.com/' + esc(r.handle) + '/" target="_blank" rel="noopener">@' + esc(r.handle) + '</a></div>' +
          '<div class="stats">' + stats + '</div>' +
          '<p>' + esc(r.highlight || 'לא נבדק השבוע.') + (r.bestUrl ? ' <a href="' + esc(r.bestUrl) + '" target="_blank" rel="noopener">לפוסט</a>' : '') + '</p></div>';
      });
      html += '</div>';
    }
    html += '</section>';

    if (D.extra && D.extra.title) {
      html += '<section class="section"><div class="section-head"><h2>' + esc(D.extra.title) + '</h2></div><div class="callout"><p>' + esc(D.extra.text) + '</p></div></section>';
    }

    var S = D.suggestions || [];
    html += '<section class="section"><div class="section-head"><h2>מה כדאי לנסות</h2><p class="sub">הצעות בלבד - נכנסות לעבודה רק אחרי אישור</p></div>';
    if (S.length) {
      html += '<ol class="sugg">';
      S.forEach(function (s, i) { html += '<li class="card"><span class="no">' + (i + 1) + '</span><span class="text">' + esc(s.text) + '</span><span class="owner">' + (s.owner ? 'מי מיישמת: <b>' + esc(s.owner) + '</b>' : '') + '</span></li>'; });
      html += '</ol>';
    } else {
      html += '<p class="empty">אין שינוי מומלץ השבוע - ממשיכים כמו שזה.</p>';
    }
    html += '</section>';

    html += '<footer>' + rule + '<span>הנתונים ממטריקול · אינסטגרם, אורגני בלבד · עודכן ' + esc(D.generatedAt || '') + '</span></footer>';
    app.innerHTML = html;

    app.querySelectorAll('button[data-i]').forEach(function (bt) {
      bt.addEventListener('click', function () {
        var i = +bt.dataset.i;
        try { history.replaceState(null, '', i === 0 ? location.pathname + location.search : '#w' + WEEKS[i].reportDate); } catch (e) {}
        render(i);
        window.scrollTo({ top: 0 });
      });
    });
    METRICS.forEach(function (m, mi) { drawTrend(document.getElementById('tr-' + mi), m); });
  }

  function drawTrend(box, m) {
    if (!box) return;
    var pts = m._pts, N = m._n, W = 360, Ht = 110, padT = 14, padB = 22, padX = 10;
    var startV = START ? START[m.key] : null;
    var vals = pts.map(function (p) { return p.v; });
    if (startV != null) vals.push(startV);
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (m.key !== 'followers') lo = 0;
    if (hi === lo) hi = lo + (hi || 1);
    var pad = (hi - lo) * 0.12; hi += pad; if (m.key === 'followers') lo -= pad;
    var ih = Ht - padT - padB, iw = W - padX * 2;
    // oldest week on the right, newest on the left - Hebrew reading direction
    var x = function (i) { return N <= 1 ? W / 2 : W - padX - (i / (N - 1)) * iw; };
    var y = function (v) { return padT + ih - (v - lo) / (hi - lo) * ih; };
    var line = pts.map(function (p, k) { return (k ? 'L' : 'M') + x(p.i).toFixed(1) + ',' + y(p.v).toFixed(1); }).join(' ');
    var area = line + ' L' + x(pts[pts.length - 1].i).toFixed(1) + ',' + (padT + ih) + ' L' + x(pts[0].i).toFixed(1) + ',' + (padT + ih) + ' Z';
    var svg = '<svg viewBox="0 0 ' + W + ' ' + Ht + '" role="img" aria-label="' + esc(m.label) + ' לפי שבוע">' +
      '<line x1="' + padX + '" x2="' + (W - padX) + '" y1="' + (padT + ih) + '" y2="' + (padT + ih) + '" stroke="var(--line)" stroke-width="1"/>';
    if (startV != null) svg += '<line x1="' + padX + '" x2="' + (W - padX) + '" y1="' + y(startV).toFixed(1) + '" y2="' + y(startV).toFixed(1) + '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>';
    svg += '<path d="' + area + '" fill="var(--bronze)" fill-opacity="0.12"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--bronze)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    var first = pts[0], lastP = pts[pts.length - 1];
    svg += '<text x="' + x(first.i) + '" y="' + (Ht - 4) + '" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Assistant, sans-serif">' + d(first.h.weekStart) + '</text>' +
      '<text x="' + x(lastP.i) + '" y="' + (Ht - 4) + '" text-anchor="start" font-size="11" font-weight="700" fill="var(--ink-2)" font-family="Assistant, sans-serif">' + d(lastP.h.weekStart) + '</text>';
    pts.forEach(function (p, k) {
      var isLast = k === pts.length - 1;
      svg += '<circle cx="' + x(p.i) + '" cy="' + y(p.v) + '" r="' + (isLast ? 5 : 3) + '" fill="' + (isLast ? 'var(--bronze)' : 'var(--surface)') + '" stroke="' + (isLast ? 'var(--surface)' : 'var(--bronze)') + '" stroke-width="2"/>';
    });
    var slot = N > 1 ? iw / (N - 1) : iw;
    pts.forEach(function (p, k) {
      svg += '<rect x="' + (x(p.i) - slot / 2) + '" y="0" width="' + slot + '" height="' + Ht + '" fill="transparent" data-k="' + k + '"/>';
    });
    svg += '</svg><div class="tip" hidden></div>';
    box.innerHTML = svg;
    var tip = box.querySelector('.tip'), svgEl = box.querySelector('svg');
    box.querySelectorAll('rect[data-k]').forEach(function (rc) {
      rc.addEventListener('mouseenter', function () {
        var p = pts[+rc.dataset.k], sc = svgEl.getBoundingClientRect().width / W;
        tip.textContent = 'שבוע ' + d(p.h.weekStart) + ': ' + n(p.v, m.dec) + (p.h.posts != null ? ' · ' + p.h.posts + ' פוסטים' : '');
        tip.style.left = (x(p.i) * sc) + 'px';
        tip.style.top = (y(p.v) * sc - 8) + 'px';
        tip.hidden = false;
      });
      rc.addEventListener('mouseleave', function () { tip.hidden = true; });
    });
  }

  render(pick());
})();
</script>
